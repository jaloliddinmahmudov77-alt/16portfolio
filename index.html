<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>16Portfolio — 16-maktab o'quvchilari portfoliosi</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <!-- Orqa fondagi harakatlanuvchi rangli dog'lar -->
  <div class="blobs" aria-hidden="true"><span></span><span></span><span></span></div>

  <nav class="nav" id="nav">
    <div class="nav-inner">
      <div class="nav-logo secret-logo" title="16Portfolio">16<span>Portfolio</span></div>
      <a href="#sinflar-bolim" class="nav-link">Sinflar</a>
    </div>
  </nav>

  <header class="hero" id="hero">
    <div class="hero-bg" id="hero-bg"></div>
    <div class="hero-overlay"></div>
    <canvas id="zarrachalar" aria-hidden="true"></canvas>

    <div class="hero-inner">
      <div class="pill reveal">🏫 16-maktab</div>
      <h1 class="logo reveal secret-logo">16<span>Portfolio</span></h1>
      <p class="tagline reveal"><span id="yozuv"></span><span class="cursor">|</span></p>
      <div class="stats reveal" id="stats"></div>
      <a href="#sinflar-bolim" class="cta reveal">O'quvchilarni ko'rish ↓</a>
    </div>

    <a href="#sinflar-bolim" class="scroll-hint" aria-label="Pastga"><span></span></a>
  </header>

  <main class="container">
    <section class="glass controls reveal" id="sinflar-bolim">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="search" id="qidiruv" placeholder="O'quvchi ismini qidiring...">
      </div>

      <h2 class="section-title">Sinfni tanlang</h2>
      <div class="grades" id="sinflar"></div>
      <div class="letters" id="harflar"></div>
    </section>

    <section>
      <h2 class="section-title big reveal" id="sarlavha">Barcha o'quvchilar</h2>
      <div class="cards" id="kartalar"></div>
      <p class="empty" id="bosh" hidden>Bu sinfda hozircha o'quvchi qo'shilmagan.</p>
    </section>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="close" id="yopish" aria-label="Yopish">×</button>
      <div id="modal-ichi"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-bg"></div>
    <div class="footer-inner">
      <div class="nav-logo">16<span>Portfolio</span></div>
      <p>16-maktab o'quvchilarining yutuqlari va orzulari bir joyda</p>
      <small>© 2026 16-maktab</small>
    </div>
  </footer>

  <script src="data.js?v=3"></script>
  <script src="store.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
